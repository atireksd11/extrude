name: Offline stabilization gate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[dev]'
      - name: Install local verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb xauth libgl1-mesa-dri ngspice
      - name: Phase 0 and native failure-mode regressions
        run: python -m pytest -q tests/test_stabilization.py tests/phase6/test_buck_trust.py tests/test_native_failures.py
      - name: Project Atlas gate
        run: python -m pytest -q -m atlas --basetemp "$RUNNER_TEMP/pytest-atlas"
      - name: Workspace UI state gate
        run: node tests/ui/github_workspace.test.cjs
      - name: Legacy hardware harness
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python -m pytest -q -m legacy --basetemp "$RUNNER_TEMP/pytest-legacy"
      - name: Installed UI smoke test
        run: |
          cd "$(mktemp -d)"
          python -c "from fastapi.testclient import TestClient; from extrude.api.server import app; c=TestClient(app); assert all(c.get(p).is_success for p in ('/', '/projects', '/static/app.js', '/static/projects.js', '/v1/projects', '/v1/status')); assert c.post('/v1/projects/demo').is_success"
      - name: Container smoke test
        run: |
          docker build --tag extrude-ci .
          docker run --rm --volume "$PWD/tests/fixtures/phase2:/fixtures:ro" extrude-ci python -c 'from pathlib import Path; from extrude.kicad_audit import tool_version, _execute, PINNED_VERSION; from extrude.kicad_snapshot import Snapshot; p=Path("/fixtures/clean"); s=Snapshot(p, {f.name for f in p.iterdir()}); assert tool_version() == PINNED_VERSION; assert all(r.outcome == "ran" for r in _execute(s, "board.kicad_pcb", "drc", {}, parity=True).values()); assert _execute(s, "board.kicad_sch", "erc", s.sheets("board.kicad_sch"))["erc"].outcome == "ran"'
          container=$(docker run --detach --publish 127.0.0.1:8000:8000 extrude-ci)
          trap 'docker rm -f "$container"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:8000/projects > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/v1/projects > /dev/null
