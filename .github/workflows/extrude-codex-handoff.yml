name: Extrude Codex handoff

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/extrude-codex-handoff.yml
      - .github/codex/extrude-request.cjs

permissions: {}

concurrency:
  group: extrude-codex-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      github.repository == 'atireksd11/extrude' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && github.actor_id == '226159991' &&
        !github.event.issue.pull_request && startsWith(github.event.comment.body, '/codex ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      issue: ${{ steps.request.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify request rules
        run: node .github/codex/extrude-request.cjs --self-test
      - name: Prepare owner request
        if: github.event_name == 'issue_comment'
        id: request
        run: node .github/codex/extrude-request.cjs
      - name: Report that hosted execution is disabled
        if: steps.request.outputs.issue != '' && vars.EXTRUDE_CODEX_ACTIONS_ENABLED != 'true'
        run: echo 'Codex Actions execution is disabled. Use the published Extrude Codex Cloud environment for this task.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save prompt for Codex
        if: steps.request.outputs.issue != '' && vars.EXTRUDE_CODEX_ACTIONS_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-request
          path: ${{ runner.temp }}/extrude-codex-request.txt
          retention-days: 1
          overwrite: true

  generate:
    needs: intake
    if: needs.intake.outputs.issue != '' && vars.EXTRUDE_CODEX_ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check runner credential
        env:
          CODEX_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$CODEX_KEY_PRESENT" != true ]; then
            echo '::error::Configure the OPENAI_API_KEY Actions secret to enable Codex requests.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: codex-request
          path: ${{ runner.temp }}/codex-request
      - name: Run Codex
        uses: openai/codex-action@v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-request/extrude-codex-request.txt
          safety-strategy: drop-sudo
          sandbox: workspace-write
          allow-users: atireksd11
      - name: Capture proposed changes
        run: |
          git add -A
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/extrude-codex.patch"
          test -s "$RUNNER_TEMP/extrude-codex.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-patch
          path: ${{ runner.temp }}/extrude-codex.patch
          retention-days: 1
          overwrite: true

  draft:
    needs: [intake, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.intake.outputs.issue }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: codex-patch
          path: ${{ runner.temp }}/codex-patch
      - name: Open or find the draft pull request
        shell: bash
        run: |
          branch="codex/extrude-issue-$ISSUE_NUMBER-$COMMENT_ID"
          existing=$(gh pr list --head "$branch" --state all --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            printf 'Draft result: %s\n' "$existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$(git ls-remote --heads origin "refs/heads/$branch")" ]; then
            git apply --index --binary "$RUNNER_TEMP/codex-patch/extrude-codex.patch"
            git diff --cached --check
            git diff --cached --quiet -- .github .gitmodules vercel.json || {
              echo '::error::Review workflow, submodule, or deployment configuration changes in the patch artifact.'
              exit 1
            }
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                -c core.hooksPath=/dev/null commit -m "Propose changes for Extrude issue #$ISSUE_NUMBER"
            git push origin "HEAD:refs/heads/$branch"
          fi
          url=$(gh pr create --draft --base "main" --head "$branch" \
            --title "Codex proposal for Extrude issue #$ISSUE_NUMBER" \
            --body "Requested in #$ISSUE_NUMBER. Review the diff and checks before merging.")
          printf 'Draft result: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
